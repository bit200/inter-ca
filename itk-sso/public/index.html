<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Реестр OAuth-клиентов · ITK SSO</title>
    <base href="__BASE__">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="topbar">
    <div class="topbar__title">
        <span class="topbar__service">ITK SSO</span>
        <h1>Реестр OAuth-клиентов</h1>
    </div>
    <div class="topbar__actions">
        <button type="button" class="btn btn--primary" id="addClient">Подключить систему</button>
        <button type="button" class="btn btn--ghost" id="logout">Выйти</button>
    </div>
</header>

<main class="layout">
    <section class="registry" aria-label="Приложения">
        <div class="registry__filters">
            <input type="search" id="search" class="field field--search" placeholder="Поиск по названию или client_id" aria-label="Поиск приложения">
            <div class="seg" role="group" aria-label="Показывать">
                <button type="button" class="seg__btn is-on" data-enabled="">Все</button>
                <button type="button" class="seg__btn" data-enabled="true">Включённые</button>
                <button type="button" class="seg__btn" data-enabled="false">Выключенные</button>
            </div>
        </div>
        <ul class="registry__list" id="clientList"></ul>
    </section>

    <section class="detail" id="detail" aria-live="polite"></section>
</main>

<section class="journal" aria-label="Журнал токенов">
    <div class="journal__head">
        <h2>Журнал токенов</h2>
        <div class="journal__filters">
            <span class="journal__scope" id="journalScope">по всем приложениям</span>
            <div class="seg" role="group" aria-label="Событие">
                <button type="button" class="seg__btn is-on" data-event="">Все</button>
                <button type="button" class="seg__btn" data-event="issued">Выдачи</button>
                <button type="button" class="seg__btn" data-event="revoked">Отзывы</button>
                <button type="button" class="seg__btn" data-event="denied">Отказы</button>
            </div>
        </div>
    </div>
    <div class="journal__scroll">
        <table class="journal__table" id="journalTable"></table>
    </div>
</section>

<script src="admin.js"></script>
</body>
</html>
