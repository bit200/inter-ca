# Автодеплой прода после мержа в master.
# Выполняется на self-hosted runner'е, который стоит на самом ВПС 212.8.247.141 —
# SSH-ключей от прода в GitHub нет, деплой запускается локально.
# Установка и настройка runner'а: deploy/self-hosted-runner.md
name: Deploy prod

on:
  push:
    branches: [master]
  workflow_dispatch:

# На этом же ВПС и через этот же nginx деплоится itk-platform-en. concurrency
# защищает от параллельных запусков внутри репозитория, flock в шаге ниже — от
# пересечения с деплоем itk-platform-en.
concurrency:
  group: deploy-prod-inter-ca
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, itk-vps]
    # environment даёт историю деплоев в GitHub и, при желании, ручной approve
    # (Settings -> Environments -> production -> Required reviewers).
    environment: production
    steps:
      # Два отдельных шага, а не один sudo-скрипт: prod-deploy.sh делает git
      # fetch/reset и npm ci/build (код зависимостей) и запускается БЕЗ root, от
      # deploy — иначе root бы выполнял произвольный код из зависимостей/master.
      # Только сама подмена build/ + nginx reload реально требует root, и делает
      # это отдельный inter-ca-apply-build.sh, установленный вне репозитория и
      # принадлежащий root (не deploy) — см. deploy/self-hosted-runner.md.
      - name: Build (без root)
        # Скрипт берётся из рабочей копии на сервере, а не из checkout'а runner'а:
        # prod-deploy.sh сам делает git fetch/reset в этой копии и собирает build-new
        # с health-check на диске.
        run: flock /var/lock/itk-deploy.lock "${APP_DIR}/deploy/prod-deploy.sh"
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR || '/var/www/inter-ca' }}
      - name: Apply build (root)
        # sudo -n: разрешён без пароля только этот фиксированный путь вне
        # git-репозитория — см. sudoers в deploy/self-hosted-runner.md.
        run: sudo -n /usr/local/sbin/inter-ca-apply-build.sh
        env:
          APP_DIR: ${{ vars.PROD_APP_DIR || '/var/www/inter-ca' }}
